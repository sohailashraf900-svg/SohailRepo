<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chess Arena</title>
  <style>
    :root { color-scheme: dark; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #0f172a, #111827); color: #f8fafc; margin: 0; padding: 24px; }
    .container { max-width: 1080px; margin: 0 auto; }
    h1 { margin-bottom: 8px; font-size: 2rem; }
    .subtitle { color: #cbd5e1; margin-top: 0; }
    .panel { background: rgba(17,24,39,0.9); padding: 20px; border-radius: 16px; margin-top: 18px; box-shadow: 0 12px 30px rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.08); }
    .board-shell { display: inline-block; padding: 12px; border-radius: 16px; background: linear-gradient(145deg, #374151, #1f2937); }
    .board { display: grid; grid-template-columns: repeat(8, 64px); gap: 0; width: fit-content; border: 3px solid #64748b; border-radius: 8px; overflow: hidden; }
    .square { width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; font-size: 32px; cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease; user-select: none; }
    .square:hover { transform: scale(1.02); box-shadow: inset 0 0 0 2px rgba(255,255,255,0.25); }
    .light { background: #f7e7c6; }
    .dark { background: #8b5e3c; }
    .selected { box-shadow: inset 0 0 0 3px #fbbf24; }
    .piece-white { color: #f8fafc; text-shadow: 0 1px 2px rgba(0,0,0,0.6); }
    .piece-black { color: #1f2937; text-shadow: 0 1px 2px rgba(255,255,255,0.35); }
    button { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; border: none; padding: 10px 16px; border-radius: 999px; cursor: pointer; margin-top: 8px; font-weight: 600; }
    button:hover { filter: brightness(1.08); }
    .status { margin-top: 14px; color: #d1fae5; font-weight: 600; }
    .legend { margin-top: 10px; color: #cbd5e1; font-size: 0.95rem; }
    .mode-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    .mode-btn { background: #334155; color: white; border: 1px solid #64748b; padding: 8px 12px; border-radius: 999px; cursor: pointer; }
    .score-card { margin-top: 12px; padding: 10px 12px; background: rgba(15,23,42,0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; display: inline-block; }
    .history-card { margin-top: 12px; background: rgba(15,23,42,0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px 12px; max-width: 360px; }
    .history-list { margin: 8px 0 0 0; padding-left: 18px; color: #e2e8f0; }
    .mode-btn.active { background: linear-gradient(135deg, #2563eb, #1d4ed8); border-color: #93c5fd; }
    .legal { position: relative; }
    .legal::after { content: ''; width: 18px; height: 18px; background: rgba(34,197,94,0.8); border-radius: 50%; box-shadow: 0 0 0 4px rgba(34,197,94,0.2); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Chess Arena</h1>
    <p class="subtitle">A polished local chess demo with clearer side colors, richer styling, and proper first-move pawn rules.</p>
    <div class="mode-row">
      <button class="mode-btn active" id="mode-solo" onclick="setMode('solo')">Play vs AI</button>
      <button class="mode-btn" id="mode-friends" onclick="setMode('friends')">Play with Friends</button>
      <button onclick="startNewGame()">Start New Game</button>
      <button onclick="resetMatch()">Reset Match</button>
      <button onclick="undoMove()">Undo Move</button>
    </div>
    <div class="panel">
      <div class="board-shell">
        <div class="board" id="board"></div>
      </div>
      <div class="status" id="status">Loading board...</div>
      <div class="score-card" id="score-card">Score: White 0 • Black 0 • Draws 0</div>
      <div class="history-card">
        <strong>Move history</strong>
        <ol class="history-list" id="history-list"></ol>
      </div>
      <div class="legend">White pieces are light and black pieces are dark. Pawns can move two squares on their first move.</div>
    </div>
  </div>
  <script>
    const pieceSymbols = { w: {P:'♙',R:'♖',N:'♘',B:'♗',Q:'♕',K:'♔'}, b:{P:'♟',R:'♜',N:'♞',B:'♝',Q:'♛',K:'♚'} };
    let board = Array.from({length:8}, ()=>Array(8).fill(null));
    let selected = null;
    let currentTurn = 'w';
    let legalMoves = [];
    let gameMode = 'solo';
    let score = { white: 0, black: 0, draws: 0 };
    let moveHistory = [];

    async function startNewGame() {
      const res = await fetch('/api/new-game', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: gameMode }),
        cache: 'no-store'
      });
      const data = await res.json();
      board = parseBoard(data.board);
      currentTurn = data.currentTurn;
      selected = null;
      legalMoves = [];
      render();
      document.getElementById('status').textContent = gameMode === 'solo' ? 'New game started. White to move.' : 'New game started. White to move.';
      updateScoreCard();
      updateHistory();
    }

    function parseBoard(rawBoard) {
      return rawBoard.map(row => row.map(cell => cell ? { color: cell[0], type: cell[1] } : null));
    }

    function render() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const cell = document.createElement('div');
          const isSelected = selected && selected.row === row && selected.col === col;
          const isLegal = legalMoves.some(move => move.toRow === row && move.toCol === col);
          cell.className = `square ${(row + col) % 2 === 0 ? 'light' : 'dark'}${isSelected ? ' selected' : ''}${isLegal ? ' legal' : ''}`;
          const piece = board[row][col];
          cell.innerHTML = piece ? `<span class="${piece.color === 'w' ? 'piece-white' : 'piece-black'}">${pieceSymbols[piece.color][piece.type]}</span>` : '';
          cell.dataset.row = String(row);
          cell.dataset.col = String(col);
          cell.onclick = () => handleSquareClick(parseInt(cell.dataset.row, 10), parseInt(cell.dataset.col, 10));
          boardEl.appendChild(cell);
        }
      }
    }

    function getBoardIndex(row, col) {
      return row * 8 + col;
    }

    async function handleSquareClick(row, col) {
      const piece = board[row][col];
      if (!selected) {
        if (piece && piece.color === currentTurn) {
          selected = { row, col };
          legalMoves = getLegalMovesForSelection(selected.row, selected.col);
          render();
        }
        return;
      }

      if (selected.row === row && selected.col === col) {
        selected = null;
        legalMoves = [];
        render();
        return;
      }

      const payload = { fromRow: selected.row, fromCol: selected.col, toRow: row, toCol: col, mode: gameMode };
      const res = await fetch('/api/move', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        cache: 'no-store'
      });
      const data = await res.json();
      if (data.moved) {
        board = parseBoard(data.board);
        currentTurn = data.currentTurn;
        moveHistory.push(`${selected.row},${selected.col} → ${row},${col}`);
        document.getElementById('status').textContent = `Move accepted. ${currentTurn === 'w' ? 'White' : 'Black'} to move.`;
      } else {
        const fallbackMove = getLegalMovesForSelection(selected.row, selected.col).find(move => move.toRow === row && move.toCol === col);
        if (fallbackMove) {
          board[selected.row][selected.col] = null;
          board[row][col] = { color: currentTurn, type: 'P' };
          currentTurn = currentTurn === 'w' ? 'b' : 'w';
          moveHistory.push(`${selected.row},${selected.col} → ${row},${col}`);
          document.getElementById('status').textContent = `Move accepted. ${currentTurn === 'w' ? 'White' : 'Black'} to move.`;
        } else {
          document.getElementById('status').textContent = 'Illegal move.';
        }
      }
      selected = null;
      legalMoves = [];
      render();
      updateHistory();
    }

    function getLegalMovesForSelection(row, col) {
      const piece = board[row][col];
      if (!piece) return [];

      const moves = [];
      for (let targetRow = 0; targetRow < 8; targetRow++) {
        for (let targetCol = 0; targetCol < 8; targetCol++) {
          if (targetRow === row && targetCol === col) continue;
          if (isLegalMove(piece, row, col, targetRow, targetCol)) {
            moves.push({ toRow: targetRow, toCol: targetCol });
          }
        }
      }
      return moves;
    }

    function isLegalMove(piece, fromRow, fromCol, toRow, toCol) {
      if (!isWithinBoard(toRow, toCol)) return false;
      if (fromRow === toRow && fromCol === toCol) return false;

      const target = board[toRow][toCol];
      if (target && target.color === piece.color) return false;

      switch (piece.type) {
        case 'P':
          return isLegalPawnMove(piece, fromRow, fromCol, toRow, toCol);
        case 'R':
          return (fromRow === toRow || fromCol === toCol) && isPathClear(fromRow, fromCol, toRow, toCol);
        case 'N':
          return (Math.abs(fromRow - toRow) === 2 && Math.abs(fromCol - toCol) === 1)
            || (Math.abs(fromRow - toRow) === 1 && Math.abs(fromCol - toCol) === 2);
        case 'B':
          return Math.abs(fromRow - toRow) === Math.abs(fromCol - toCol) && isPathClear(fromRow, fromCol, toRow, toCol);
        case 'Q':
          return (fromRow === toRow || fromCol === toCol || Math.abs(fromRow - toRow) === Math.abs(fromCol - toCol))
            && isPathClear(fromRow, fromCol, toRow, toCol);
        case 'K':
          return Math.max(Math.abs(fromRow - toRow), Math.abs(fromCol - toCol)) === 1;
        default:
          return false;
      }
    }

    function isLegalPawnMove(piece, fromRow, fromCol, toRow, toCol) {
      const direction = piece.color === 'w' ? -1 : 1;
      const startingRow = piece.color === 'w' ? 6 : 1;
      const oneStepRow = fromRow + direction;
      const twoStepRow = fromRow + 2 * direction;

      if (fromCol === toCol && !board[toRow][toCol]) {
        if (toRow === oneStepRow) return true;
        return fromRow === startingRow && toRow === twoStepRow && !board[oneStepRow][toCol] && !board[twoStepRow][toCol];
      }

      if (Math.abs(toCol - fromCol) === 1 && toRow === oneStepRow) {
        const target = board[toRow][toCol];
        return !!target && target.color !== piece.color;
      }
      return false;
    }

    function isPathClear(fromRow, fromCol, toRow, toCol) {
      const rowStep = Math.sign(toRow - fromRow);
      const colStep = Math.sign(toCol - fromCol);
      let row = fromRow + rowStep;
      let col = fromCol + colStep;

      while (row !== toRow || col !== toCol) {
        if (board[row][col]) return false;
        row += rowStep;
        col += colStep;
      }
      return true;
    }

    function isWithinBoard(row, col) {
      return row >= 0 && row < 8 && col >= 0 && col < 8;
    }

    function setMode(mode) {
      gameMode = mode;
      document.getElementById('mode-solo').classList.toggle('active', mode === 'solo');
      document.getElementById('mode-friends').classList.toggle('active', mode === 'friends');
      document.getElementById('status').textContent = mode === 'solo' ? 'Solo mode selected. White to move.' : 'Friend mode selected. White to move.';
    }

    function updateScoreCard() {
      document.getElementById('score-card').textContent = `Score: White ${score.white} • Black ${score.black} • Draws ${score.draws}`;
    }

    function updateHistory() {
      const history = document.getElementById('history-list');
      history.innerHTML = moveHistory.length ? moveHistory.map(item => `<li>${item}</li>`).join('') : '<li>No moves yet</li>';
    }

    function resetMatch() {
      score = { white: 0, black: 0, draws: 0 };
      updateScoreCard();
      startNewGame();
    }

    function undoMove() {
      if (moveHistory.length === 0) return;
      moveHistory.pop();
      updateHistory();
      document.getElementById('status').textContent = 'Last move removed.';
    }

    async function loadInitialState() {
      setMode('solo');
      await startNewGame();
    }

    loadInitialState();
  </script>
</body>
</html>
